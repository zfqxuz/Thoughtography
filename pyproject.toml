[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thoughtography"
version = "0.1.0"
description = "Extract on-screen dialogue and narration from hand-drawn / visual-novel videos into a Fountain script."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
bili = ["rapidocr-onnxruntime>=1.4.0"]

[project.scripts]
thoughtography = "thoughtography.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
